name: Build Electron App

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'files_app_discovery/package-lock.json'

      - name: Install dependencies
        working-directory: files_app_discovery
        run: npm install

      - name: Build Windows
        working-directory: files_app_discovery
        run: npm run build-win

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: files_app_discovery/dist/
          retention-days: 5

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'files_app_discovery/package-lock.json'

      - name: Install dependencies
        working-directory: files_app_discovery
        run: npm install

      - name: Build macOS
        working-directory: files_app_discovery
        run: npm run build-mac

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: files_app_discovery/dist/
          retention-days: 5

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'files_app_discovery/package-lock.json'

      - name: Install dependencies
        working-directory: files_app_discovery
        run: npm install

      - name: Build Linux
        working-directory: files_app_discovery
        run: npm run build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: files_app_discovery/dist/
          retention-days: 5

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release with gh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes || true

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          find artifacts -type f | while read file; do
            gh release upload "$TAG_NAME" "$file" --repo "$GITHUB_REPOSITORY" --clobber
          done
